<title>LexForm</title>
<meta name="description" content="Oʻzbekiston yuridik hujjatlari shablonlari: forma toʻldiring, hujjat tayyor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<style>
/* Layout: three working columns — template register | form | A4 sheet with live preview. Stacks on phones. */
:root {
  --bg: #e9ecf2;
  --panel: #f7f8fb;
  --raised: #ffffff;
  --ink: #1b2130;
  --muted: #5a6376;
  --line: #d3d8e2;
  --stamp: #3044a6;          /* seal-ink blue, the one accent */
  --stamp-soft: #e2e6fa;
  --mark: #e7ecff;           /* highlight of filled values in the sheet */
  --danger: #b4232f;
  --ok: #1f7a4d;
  --sheet: #ffffff;          /* the document paper stays paper in both themes */
  --sheet-ink: #111111;
  --sheet-line: #444444;
  --f-ui: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-doc: "PT Serif", "Times New Roman", Times, serif;
  --f-mono: "PT Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141b; --panel: #181c25; --raised: #1f2430; --ink: #e5e8ef; --muted: #98a1b3;
    --line: #2d3342; --stamp: #8e9dff; --stamp-soft: #262d4f; --mark: #e7ecff;
    --danger: #ff7b86; --ok: #5fd39a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141b; --panel: #181c25; --raised: #1f2430; --ink: #e5e8ef; --muted: #98a1b3;
  --line: #2d3342; --stamp: #8e9dff; --stamp-soft: #262d4f; --mark: #e7ecff;
  --danger: #ff7b86; --ok: #5fd39a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 270px minmax(320px, 420px) minmax(0, 1fr); height: 100%; }

/* ---- template register ---- */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 18px 18px 12px; display: flex; align-items: baseline; gap: 8px; }
.brand b { font-size: 20px; letter-spacing: -0.02em; }
.brand b span { color: var(--stamp); }
.brand small { color: var(--muted); font-size: 12px; }
.search { margin: 0 14px 10px; }
.search input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); }
.list { overflow: auto; padding: 0 8px 16px; flex: 1; }
.cat { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 14px 10px 6px; }
.tpl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: var(--r); cursor: pointer; }
.tpl:hover { background: var(--stamp-soft); }
.tpl[aria-current="true"] { background: var(--stamp); color: #fff; }
.tpl .t { font-weight: 500; line-height: 1.3; }
.tpl .lang { font: 11px var(--f-mono); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; align-self: start; opacity: .7; }
.tpl .s { grid-column: 1 / -1; font-size: 12px; opacity: .75; line-height: 1.3; }

/* ---- form ---- */
.form { background: var(--raised); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.form-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.form-head h1 { margin: 0; font-size: 17px; line-height: 1.3; text-wrap: balance; }
.form-head p { margin: 0; color: var(--muted); font-size: 12.5px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--raised); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--stamp); color: var(--stamp); }
.btn.primary { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.fields { overflow: auto; padding: 6px 18px 40px; flex: 1; }
fieldset { border: 0; padding: 0; margin: 14px 0 0; display: grid; gap: 10px; }
legend { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--stamp); font-weight: 600; padding: 6px 0 2px; }
.f { display: grid; gap: 4px; }
.f label { font-size: 12.5px; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.f textarea { min-height: 64px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--stamp); background: var(--raised); outline: none; box-shadow: 0 0 0 3px var(--stamp-soft); }
.f .hint { font-size: 11.5px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rows { display: grid; gap: 8px; }
.rowcard { border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; gap: 6px; background: var(--panel); }
.rowcard .rc-head { display: flex; justify-content: space-between; align-items: center; font: 12px var(--f-mono); color: var(--muted); }
.rowcard .rc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.rowcard input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); }
.x { border: 0; background: none; color: var(--danger); cursor: pointer; font-size: 12px; }

/* ---- preview ---- */
.preview { overflow: auto; min-width: 0; padding: 22px 24px 60px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pv-bar { width: 100%; max-width: 794px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12.5px; }
.pv-bar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.toast { color: var(--ok); font-weight: 500; }
.sheet {
  background: var(--sheet); color: var(--sheet-ink);
  width: 100%; max-width: 794px; min-height: 1123px;
  padding: 72px 64px 80px 90px;
  box-shadow: 0 1px 2px rgba(15, 20, 40, .08), 0 8px 28px rgba(15, 20, 40, .10);
  font: 15px/1.5 var(--f-doc);
  overflow-wrap: anywhere;
}
.sheet h2 { font-size: 15px; text-align: center; margin: 0 0 2px; text-transform: uppercase; letter-spacing: .02em; }
.sheet h3 { font-size: 15px; text-align: center; margin: 14px 0 6px; }
.sheet p { margin: 0 0 8px; text-align: justify; }
.sheet .c { text-align: center; }
.sheet .r { text-align: right; }
.sheet .sp { letter-spacing: .35em; font-weight: 700; text-align: center; margin: 12px 0; }
.sheet .meta { display: flex; justify-content: space-between; gap: 16px; margin: 10px 0 14px; }
.sheet ol { margin: 0 0 8px; padding-left: 22px; }
.sheet li { margin-bottom: 4px; text-align: justify; }
.sheet table.t { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 13.5px; }
.sheet table.t th, .sheet table.t td { border: 1px solid var(--sheet-line); padding: 4px 6px; vertical-align: top; }
.sheet table.t th { font-weight: 700; text-align: center; }
.sheet table.t td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sheet table.sig { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 14px; }
.sheet table.sig td { width: 50%; vertical-align: top; padding: 0 10px 0 0; }
.sheet .pb { border-top: 1px dashed #b9b9b9; margin: 34px -20px 28px; position: relative; }
.sheet .pb::after { content: "keyingi sahifa"; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--sheet); padding: 0 8px; font: 11px var(--f-ui); color: #8a8a8a; }
.v { }
.show-marks .v { background: var(--mark); border-radius: 2px; box-shadow: 0 0 0 1px var(--mark); }
.blank { color: #8a8a8a; }
.ex-note { width: 100%; max-width: 794px; font-size: 12px; color: var(--muted); }

/* mobile tabs */
.tabs { display: none; }
@media (max-width: 1100px) {
  .app { grid-template-columns: 240px minmax(0, 1fr); }
  .form { border-right: 0; }
  .preview { grid-column: 1 / -1; }
  .app { height: auto; }
  .side, .form { max-height: none; }
  .list, .fields { overflow: visible; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .list { max-height: 260px; overflow: auto; }
  .tabs { display: flex; gap: 6px; padding: 10px 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; }
  .tabs button[aria-pressed="true"] { background: var(--stamp); color: #fff; border-color: var(--stamp); }
  .app[data-tab="form"] .preview, .app[data-tab="preview"] .form { display: none; }
  .preview { padding: 16px; }
  .sheet { padding: 28px 18px 36px; font-size: 14px; min-height: 0; }
  .row2 { grid-template-columns: 1fr; }
}
@media print {
  body { background: #fff; }
  .side, .form, .pv-bar, .tabs, .ex-note { display: none !important; }
  .app { display: block; height: auto; }
  .preview { padding: 0; overflow: visible; }
  .sheet { box-shadow: none; max-width: none; min-height: 0; padding: 0; }
  .show-marks .v { background: none; box-shadow: none; }
  .sheet .pb { border: 0; margin: 0; break-after: page; }
  .sheet .pb::after { display: none; }
  @page { size: A4; margin: 20mm 15mm 20mm 25mm; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app" data-tab="form">
  <aside class="side">
    <div class="brand"><b>Lex<span>Form</span></b><small>hujjat shablonlari</small></div>
    <div class="search"><input id="q" type="search" placeholder="Shablon qidirish…" aria-label="Shablon qidirish"></div>
    <nav class="list" id="list" aria-label="Shablonlar"></nav>
  </aside>

  <div class="tabs" role="group" aria-label="Koʻrinish">
    <button class="btn" id="tab-form" aria-pressed="true">Forma</button>
    <button class="btn" id="tab-preview" aria-pressed="false">Hujjat</button>
  </div>

  <section class="form" aria-label="Forma">
    <div class="form-head">
      <h1 id="t-title"></h1>
      <p id="t-desc"></p>
      <div class="toolbar">
        <button class="btn" id="b-example" type="button">Namuna bilan toʻldirish</button>
        <button class="btn" id="b-clear" type="button">Tozalash</button>
      </div>
    </div>
    <form class="fields" id="fields" autocomplete="off"></form>
  </section>

  <main class="preview" aria-label="Hujjat koʻrinishi">
    <div class="pv-bar">
      <label><input type="checkbox" id="marks" checked> Kiritilgan maʼlumotlarni belgilash</label>
      <span class="toast" id="toast" role="status"></span>
      <span class="toolbar">
        <button class="btn primary" id="b-copy" type="button">Matnni nusxalash</button>
        <button class="btn" id="b-doc" type="button" hidden>Word (.doc) yuklab olish</button>
        <button class="btn" id="b-print" type="button" hidden>Chop etish / PDF</button>
      </span>
    </div>
    <article class="sheet show-marks" id="sheet"></article>
    <p class="ex-note" id="ex-note"></p>
  </main>
</div>

<script>
/* =========================================================================
   LexForm — document templates for Uzbekistan (Uzbek Cyrillic / Russian)
   Pure logic first (formatters + templates), UI wiring at the bottom.
   ========================================================================= */

// ---------- number & money formatting ----------
function parseNum(s) {
  if (s === null || s === undefined) return NaN;
  const t = String(s).replace(/\s+/g, '').replace(',', '.');
  if (t === '') return NaN;
  return Number(t);
}
function fmtMoney(n) {
  if (!isFinite(n)) return '';
  const neg = n < 0; n = Math.abs(n);
  let [i, d] = n.toFixed(2).split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + i + (d === '00' ? '' : ',' + d);
}

// Uzbek Cyrillic number words
const UZ_ONES = ['', 'бир', 'икки', 'уч', 'тўрт', 'беш', 'олти', 'етти', 'саккиз', 'тўққиз'];
const UZ_TENS = ['', 'ўн', 'йигирма', 'ўттиз', 'қирқ', 'эллик', 'олтмиш', 'етмиш', 'саксон', 'тўқсон'];
const UZ_SCALES = ['', 'минг', 'миллион', 'миллиард', 'триллион'];
function uzTriad(n) {
  const h = Math.floor(n / 100), t = Math.floor(n / 10) % 10, o = n % 10, w = [];
  if (h) w.push(UZ_ONES[h], 'юз');
  if (t) w.push(UZ_TENS[t]);
  if (o) w.push(UZ_ONES[o]);
  return w.join(' ');
}
function uzWords(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return 'нол';
  const parts = []; let i = 0;
  while (n > 0) {
    const tr = n % 1000;
    if (tr) parts.unshift(uzTriad(tr) + (UZ_SCALES[i] ? ' ' + UZ_SCALES[i] : ''));
    n = Math.floor(n / 1000); i++;
  }
  return parts.join(' ');
}
function uzMoneyWords(n) {
  if (!isFinite(n)) return '';
  const whole = Math.floor(Math.abs(n)), tiyin = Math.round((Math.abs(n) - whole) * 100);
  let s = uzWords(whole) + ' сўм';
  if (tiyin) s += ' ' + uzWords(tiyin) + ' тийин';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// Russian number words
const RU_ONES_M = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
const RU_ONES_F = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
const RU_TEENS = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
const RU_TENS = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
const RU_HUND = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
const RU_SCALES = [null, ['тысяча', 'тысячи', 'тысяч', 'f'], ['миллион', 'миллиона', 'миллионов', 'm'], ['миллиард', 'миллиарда', 'миллиардов', 'm'], ['триллион', 'триллиона', 'триллионов', 'm']];
function ruPlural(n, forms) {
  const a = n % 100, b = n % 10;
  if (a >= 11 && a <= 14) return forms[2];
  if (b === 1) return forms[0];
  if (b >= 2 && b <= 4) return forms[1];
  return forms[2];
}
function ruTriad(n, fem) {
  const h = Math.floor(n / 100), t = Math.floor(n / 10) % 10, o = n % 10, w = [];
  if (h) w.push(RU_HUND[h]);
  if (t === 1) w.push(RU_TEENS[o]);
  else { if (t) w.push(RU_TENS[t]); if (o) w.push((fem ? RU_ONES_F : RU_ONES_M)[o]); }
  return w.join(' ');
}
function ruWords(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return 'ноль';
  const parts = []; let i = 0;
  while (n > 0) {
    const tr = n % 1000;
    if (tr) {
      const sc = RU_SCALES[i];
      parts.unshift(ruTriad(tr, sc && sc[3] === 'f') + (sc ? ' ' + ruPlural(tr, sc) : ''));
    }
    n = Math.floor(n / 1000); i++;
  }
  return parts.join(' ');
}
function ruMoneyWords(n) {
  if (!isFinite(n)) return '';
  const whole = Math.floor(Math.abs(n)), tiyin = Math.round((Math.abs(n) - whole) * 100);
  let s = ruWords(whole) + ' ' + ruPlural(whole, ['сум', 'сума', 'сумов']);
  s += ' ' + String(tiyin).padStart(2, '0') + ' ' + ruPlural(tiyin, ['тийин', 'тийина', 'тийинов']);
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// dates
const UZ_MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const RU_MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
function parseDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
}
function fmtDate(s, lang) {
  const p = parseDate(s); if (!p) return '';
  const dd = String(p.d).padStart(2, '0');
  return lang === 'ru' ? `«${dd}» ${RU_MONTHS[p.m - 1]} ${p.y} г.` : `«${dd}» ${UZ_MONTHS[p.m - 1]} ${p.y} йил`;
}
function fmtDateShort(s) {
  const p = parseDate(s); if (!p) return '';
  return `${String(p.d).padStart(2, '0')}.${String(p.m).padStart(2, '0')}.${p.y}`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- render helper bound to one template's values ----------
function makeCtx(values, lang) {
  const raw = k => (values[k] ?? '').toString().trim();
  const span = s => `<span class="v">${s}</span>`;
  const blank = (w = 14) => `<span class="blank">${'_'.repeat(w)}</span>`;
  const ctx = {
    lang,
    raw,
    has: k => raw(k) !== '',
    // text value or underline blank
    x: (k, w) => raw(k) ? span(esc(raw(k)).replace(/\n/g, '<br>')) : blank(w),
    num: k => parseNum(raw(k)),
    sum: k => { const n = parseNum(raw(k)); return isFinite(n) ? span(fmtMoney(n)) : blank(10); },
    words: (k, l = lang) => { const n = parseNum(raw(k)); return isFinite(n) ? span(l === 'ru' ? ruMoneyWords(n) : uzMoneyWords(n)) : blank(30); },
    money: (k, l = lang) => { // "1 000 000 (Бир миллион сўм)"
      const n = parseNum(raw(k));
      if (!isFinite(n)) return blank(10) + ' (' + blank(30) + ')';
      return span(fmtMoney(n)) + ' (' + span(l === 'ru' ? ruMoneyWords(n) : uzMoneyWords(n)) + ')';
    },
    moneyN: (n, l = lang) => isFinite(n) && n !== 0 ? span(fmtMoney(n)) + ' (' + span(l === 'ru' ? ruMoneyWords(n) : uzMoneyWords(n)) + ')' : blank(10) + ' (' + blank(30) + ')',
    date: (k, l = lang) => raw(k) ? span(fmtDate(raw(k), l)) : (l === 'ru' ? `«${blank(3)}» ${blank(10)} 20${blank(3)} г.` : `«${blank(3)}» ${blank(10)} 20${blank(3)} йил`),
    dshort: k => raw(k) ? span(fmtDateShort(raw(k))) : blank(10),
    rows: k => Array.isArray(values[k]) ? values[k] : [],
    blank,
    span,
  };
  return ctx;
}

// ---------- shared field groups ----------
function partyFields(p, group, ex, opts = {}) {
  const f = [
    { k: p + '_name', l: 'Nomi (masalan: «Namuna» МЧЖ)', g: group, ex: ex.name },
    { k: p + '_pos', l: 'Vakil lavozimi', g: group, ex: ex.pos ?? (opts.ru ? 'Директор' : 'директор'), half: true },
    { k: p + '_rep', l: 'Vakil F.I.Sh.', g: group, ex: ex.rep, half: true },
    { k: p + '_basis', l: 'Asos (Устав / ишончнома)', g: group, ex: ex.basis ?? (opts.ru ? 'Устава' : 'Устав'), half: true },
    { k: p + '_stir', l: 'STIR (INN)', g: group, ex: ex.stir, half: true },
    { k: p + '_addr', l: 'Yuridik manzil', g: group, ex: ex.addr },
    { k: p + '_acc', l: 'Hisob raqami (h/r)', g: group, ex: ex.acc, half: true },
    { k: p + '_mfo', l: 'MFO', g: group, ex: ex.mfo, half: true },
    { k: p + '_bank', l: 'Bank', g: group, ex: ex.bank },
    { k: p + '_phone', l: 'Telefon', g: group, ex: ex.phone, half: true },
  ];
  return f;

function sigTable(left, right) {

}
function meta(left, right) { return `<div class="meta"><span>${left}</span><span>${right}</span></div>`; }

// item tables (name/unit/qty/price → sum)
function itemsTable(c, key, ru) {
  const rows = c.rows(key);
  const H = ru ? ['№', 'Наименование', 'Ед. изм.', 'Кол-во', 'Цена', 'Сумма'] : ['№', 'Номи', 'Ўлчов бирлиги', 'Миқдори', 'Нархи', 'Суммаси'];
  let total = 0, body = '';
  rows.forEach((r, i) => {
    const q = parseNum(r.qty), pr = parseNum(r.price), s = isFinite(q) && isFinite(pr) ? q * pr : NaN;
    if (isFinite(s)) total += s;
    body += `<tr><td class="n">${i + 1}</td><td>${r.name ? c.span(esc(r.name)) : c.blank(12)}</td><td>${esc(r.unit || '')}</td>
      <td class="n">${isFinite(q) ? fmtMoney(q) : ''}</td><td class="n">${isFinite(pr) ? fmtMoney(pr) : ''}</td><td class="n">${isFinite(s) ? fmtMoney(s) : ''}</td></tr>`;
  });
  if (!rows.length) body = `<tr><td class="n">1</td><td>${c.blank(12)}</td><td></td><td></td><td></td><td></td></tr>`;
  body += `<tr><td></td><td colspan="4"><b>${ru ? 'Итого' : 'Жами'}</b></td><td class="n"><b>${total ? fmtMoney(total) : ''}</b></td></tr>`;
  return { html: `<table class="t"><thead><tr>${H.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`, total };
}

const CAT_ORDER = ['Korporativ', 'Kadrlar', 'Shartnomalar'];
const LANG_LABEL = { uz: 'ЎЗ', ru: 'РУ' };

function exampleValues(t) {
  const v = {};
  t.fields.forEach(f => { v[f.k] = Array.isArray(f.ex) ? f.ex.map(r => ({ ...r })) : (f.ex ?? ''); });
  return v;
}
function emptyValues(t) {
  const v = {};
  t.fields.forEach(f => { v[f.k] = f.t === 'rows' ? [] : ''; });
  return v;
}
function renderDoc(t, values) { return t.render(makeCtx(values, t.lang)); }

/* ============================== UI ============================== */

  }
  const WORD_CSS = 'body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.4}h2,h3{text-align:center;font-size:12pt}h2{text-transform:uppercase}p,li{text-align:justify}.c{text-align:center}.r{text-align:right}.sp{text-align:center;font-weight:bold;letter-spacing:3pt}.meta{display:flex;justify-content:space-between}table.t{border-collapse:collapse;width:100%}table.t td,table.t th{border:1px solid #000;padding:3pt 5pt;font-size:11pt}td.n{text-align:right}table.sig{width:100%}table.sig td{width:50%;vertical-align:top}.blank{color:#000}';

  $('b-copy').addEventListener('click', async () => {
